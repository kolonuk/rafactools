# Lints, builds, smoke-tests and scans the image, then pushes the immutable
# main-<sha12> tag to GHCR. dadock's reconciler pins that tag; nothing here
# deploys.
name: Build and push

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "nginx.conf"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/rafactools

jobs:
  lint-dockerfile:
    name: Lint Dockerfile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

  trivy-fs:
    name: Scan source for vulnerabilities (Trivy FS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          exit-code: "1"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  build:
    needs: [lint-dockerfile, trivy-fs]
    name: Build, scan and push image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image tags
        id: meta
        run: |
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-12)"
          IMAGE_BASE="${REGISTRY}/${IMAGE_NAME}"
          {
            echo "image_base=${IMAGE_BASE}"
            echo "image_ref=${IMAGE_BASE}:main-${SHORT_SHA}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (local, for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.image_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 18081:8080 "${{ steps.meta.outputs.image_ref }}"
          ok=""
          for _ in $(seq 1 10); do
            curl -s http://localhost:18081/ | grep -q "RAFAC Tools" && { ok=1; break; }
            sleep 1
          done
          [ -n "$ok" ] || { echo "index page not served"; docker logs smoke; exit 1; }
          docker rm -f smoke

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image_ref }}
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_ref }}
          cache-from: type=gha
