# Builds the image, smoke-tests it, pushes to GHCR, and dispatches dadock's
# deploy workflow so the running stack picks up the new image.
name: Build and deploy

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "nginx.conf"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/rafactools

jobs:
  build:
    name: Build, scan and push image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compute image tags
        id: meta
        run: |
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-12)"
          IMAGE_BASE="${REGISTRY}/${IMAGE_NAME}"
          {
            echo "image_base=${IMAGE_BASE}"
            echo "image_ref=${IMAGE_BASE}:main-${SHORT_SHA}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build (local, for scanning)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.image_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 18081:8080 "${{ steps.meta.outputs.image_ref }}"
          code=""
          for _ in $(seq 1 10); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18081/health || true)"
            [ "$code" = "200" ] && break
            sleep 1
          done
          [ "$code" = "200" ] || { echo "/health did not return 200 (got $code)"; docker logs smoke; exit 1; }
          curl -s http://localhost:18081/ | grep -q "RAFAC Tools" || { echo "index page missing"; docker logs smoke; exit 1; }
          docker rm -f smoke

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ steps.meta.outputs.image_ref }}
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_ref }}
            ${{ steps.meta.outputs.image_base }}:latest
          cache-from: type=gha

  cleanup-images:
    name: Clean up old container images
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@25ad4af5be03aef10e0b3376b248688b7a44c40b # v5
        with:
          package-name: "rafactools"
          package-type: "container"
          min-versions-to-keep: 10

  trigger-dadock-deploy:
    name: Reload the dadock stack
    needs: build
    runs-on: ubuntu-24.04
    steps:
      # DADOCK_DEPLOY_TOKEN: fine-grained PAT with Actions:write on
      # kolonuk/dadock only (same secret as rafactools-planner). Without it
      # this step just prints a reminder to pull manually.
      - name: Dispatch dadock deploy workflow
        env:
          GH_TOKEN: ${{ secrets.DADOCK_DEPLOY_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "DADOCK_DEPLOY_TOKEN not set - skipping dadock reload. Pull the new image manually." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run "1. Deploy docker stack" --repo kolonuk/dadock
